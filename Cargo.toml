[workspace]
members = ["client", "common", "server", "screencode"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
anyhow = "=1.0.104"
axum = "=0.7.9"
axum-embed = "=0.1.0"
chrono = "=0.4.45"
clap = { version = "=4.6.7", features = ["derive"] }
crc32fast = "=1.5.5"
hex = "=0.4.3"
png = "=0.17.16"
reed-solomon-erasure = "=6.0.0"
rust-embed = "=8.13.0"
screenshots = "=0.7.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
tokio = { version = "=1.54.1", features = ["full"] }
tracing = "=0.1.44"
tracing-appender = "=0.2.5"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "chrono"] }
